# TechNova Micro-Cloud – Webserver auf Port 8085
services:
  web:
    image: nginx:alpine
    container_name: technova-web
    restart: unless-stopped
    ports:
      - "8085:80"          # HOST-PORT:CONTAINER-PORT – nginx lauscht im Container auf 80
    volumes:
      - ./html:/usr/share/nginx/html:ro   # Document Root von nginx, nur lesend
