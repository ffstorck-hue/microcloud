# TechNova Micro-Cloud – Webserver Apache httpd auf Port 8085
services:
  web:
    image: httpd:2.4-alpine
    container_name: technova-web
    restart: unless-stopped
    ports:
      - "8085:80"          # Apache lauscht im Container ebenfalls auf Port 80
    volumes:
      - ./html:/usr/local/apache2/htdocs:ro   # Document Root von Apache, nur lesend
